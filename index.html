function computeVisualCloud(w) {
    const cloudTotal = w.cloud ?? 0;
    const weatherCode = w.weatherCode ?? null;
    const hasLayerData = w.cloudLow != null;

    // ECMWF vrací cloud_cover_low/mid/high jako maximální pokrytí v dané vrstvě atmosféry,
    // ne jako příspěvek k celkové oblačnosti. Proto:
    //   - používáme cloudTotal jako primární základ (je vždy k dispozici a přesný)
    //   - vrstvová data jen zesilují signál při výrazné spodní oblačnosti (dobře viditelné)
    //   - váha low je vyšší (nízké mraky jsou vizuálně dominantní)
    const _fHigh = (w.cloudHigh ?? 0) / 100;
    const _fMid  = (w.cloudMid  ?? 0) / 100;
    const _fLow  = (w.cloudLow  ?? 0) / 100;
    // midBoost: střední oblačnost (altocumulus/altostratus) vizuálně dominuje při mid > low
    const midBoost = (hasLayerData && (w.cloudMid ?? 0) > 20 && (w.cloudMid ?? 0) > (w.cloudLow ?? 0))
        ? clamp(((w.cloudMid ?? 0) - 20) * 0.6, 0, 25)
        : 0;
    // layerBoost: low vizuálně dominantní, high přispívá výrazněji než dřív
    const layerBoost = hasLayerData
        ? clamp(_fLow * 30 + _fMid * 18 + _fHigh * 22, 0, 40) + midBoost
        : 0;
    // Pokud high dominuje (>50%) a low/mid jsou nízké → cirrus pokrytí,
    // použij high jako primární signál (plošný průsvitný závoj)
    const highDominant = hasLayerData && (w.cloudHigh ?? 0) > 50
        && (w.cloudLow ?? 0) < 30 && (w.cloudMid ?? 0) < 30;
    const highSignal = highDominant
        ? clamp((w.cloudHigh ?? 0) * 0.65, 0, 100)  // cirrus 75% → ~49 visualCloud
        : 0;
    const layerWeighted = hasLayerData
        ? clamp(Math.max(cloudTotal, cloudTotal * 0.7 + layerBoost, highSignal), 0, cloudTotal + 20)
        : cloudTotal;

    let apiCloud = layerWeighted;
    if (cloudResponseMode === 'veil') {
        if (cloudTotal >= 90) apiCloud = Math.max(apiCloud, 88);
        else if (cloudTotal >= 75) apiCloud = Math.max(apiCloud, cloudTotal * 0.82);
        else if (cloudTotal >= 55) apiCloud = Math.max(apiCloud, cloudTotal * 0.68);
        if (weatherCode === 3) apiCloud = Math.max(apiCloud, 86);
        else if (weatherCode === 2) apiCloud = Math.max(apiCloud, 45);
        else if (weatherCode === 1) apiCloud = Math.max(apiCloud, Math.min(cloudTotal, 35));
    } else {
        // weatherCode: slabý tah, ne tvrdé maximum — cloudová čísla mají přednost
        if (weatherCode === 0) {
            // Jasno: tvrdší cap, ale jen pokud layered není výrazně vyšší
            apiCloud = Math.min(apiCloud, Math.max(15, layerWeighted * 0.5));
        } else if (weatherCode === 1) {
            // Převážně jasno: jen jemný tah dolů, neořezávat pod layered
            apiCloud = lerp(apiCloud, Math.min(apiCloud, 42), 0.35);
        } else if (weatherCode === 2) {
            apiCloud = clamp(apiCloud, 25, 72);
        } else if (weatherCode === 3 && cloudTotal >= 90) {
            apiCloud = Math.max(apiCloud, 48);
        }
    }

    const sunPower = w.sunPower ?? 0;
    const clearSkyRatio = w.clearSkyRatio ?? null;

    // clearSkyRatio (direct/shortwave) je nejspolehlivější fyzikální signál.
    // Kvadratická křivka: ratio 0→cap 100, ratio 0.5→cap 75, ratio 0.8→cap 39, ratio 1.0→cap 5
    let correctedCloud, radiationCorrection;
    if (clearSkyRatio !== null) {
        const cloudCap = clamp(100 - clearSkyRatio * clearSkyRatio * 95, 5, 100);
        correctedCloud = clamp(Math.min(apiCloud, cloudCap), 0, 100);
        radiationCorrection = apiCloud - correctedCloud;
    } else {
        // Noc nebo nízké záření — fallback: sunPower korekce (konzervativní)
        const sunCorr = sunPower > 0.55
            ? Math.pow((sunPower - 0.55) / 0.45, 1.3) * 45
            : Math.pow(sunPower, 2.2) * 12;
        radiationCorrection = (cloudResponseMode === 'veil' && cloudTotal >= 70)
            ? sunPower * 8
            : sunCorr;
        correctedCloud = clamp(apiCloud - radiationCorrection, 0, 100);
    }
    const visualCloud = isFog(w) ? Math.min(correctedCloud * 0.28, 24) : correctedCloud;
    return {layeredCloud: layerWeighted, correctedCloud, visualCloud, radiationCorrection};
}

function applyWeather(w){
    W=w;
    cloudStyleMode = w.cloudStyle || 'default';
    const snowActive = isSnow(w);
    const rainActive = !snowActive && ((w.precipKind === 'rain') || (w.rain ?? 0) > 0.02);
    const newP=snowActive?'snow':rainActive?'rain':'none';
    raining=snowActive||rainActive;
    if(newP!==precipType){
        // Only flush texture cache when KIND changes (snow↔rain), not intensity
        const kindChanged = (newP==='snow')!==(precipType==='snow');
        precipType=newP;
        if(kindChanged) rainDropOSC={};
        raining?initRain():(drops=[]);
    } else if(raining&&!drops.length) initRain();
    const {layeredCloud, correctedCloud, visualCloud, radiationCorrection} = computeVisualCloud(w);
    // Při dešti/sněhu vynudit minimální cloudVisual → obloha musí být šedá
    const cloudVisualFinal = (rainActive || snowActive || (w.snowfall ?? 0) > 0.05)
        ? Math.max(visualCloud, 62)
        : visualCloud;
    w.cloudVisual = cloudVisualFinal;
    _tDensity=clamp((cloudVisualFinal-4)/88,0,1);
    // Při dešti/sněhu vždy minimálně zataženo
    if (rainActive || snowActive || (w.snowfall ?? 0) > 0.05) _tDensity = Math.max(_tDensity, 0.72);
    _tWind=w.wind||0;
    // Cloud layout bucket is now managed by the frame loop (smooth easing)
    // Debug výpočtu — vždy viditelný
    const dbgEl2=document.getElementById('hud-debug');
    if(dbgEl2) dbgEl2.textContent=`mode=${cloudResponseMode} cloud=${w.cloud??'?'} low=${w.cloudLow??'?'} mid=${w.cloudMid??'?'} high=${w.cloudHigh??'?'} → layered=${layeredCloud.toFixed(0)} radCorr=${radiationCorrection.toFixed(0)} vis=${visualCloud.toFixed(0)} cDens=${cDensity.toFixed(3)} code=${w.weatherCode??'?'} name=${w.name}`;
    const liveApiEl=document.getElementById('live-api');
    if(liveApiEl){
        const now=new Date();
        const ts=now.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const _radWm2 = w.sunPower!=null?(w.sunPower*700).toFixed(0):'?';
        const _radCorr = radiationCorrection.toFixed(1);
        const _csr = w.clearSkyRatio!=null?w.clearSkyRatio.toFixed(2):'—';
        const _layered = layeredCloud.toFixed(0);
        liveApiEl.innerHTML=[
            `<span style="opacity:.45">${ts}</span>`,
            `☁ total <b>${w.cloud??'?'}%</b> &nbsp; low <b>${w.cloudLow??'?'}%</b> &nbsp; mid <b>${w.cloudMid??'?'}%</b> &nbsp; high <b>${w.cloudHigh??'?'}%</b>`,
            `🌡 <b>${w.temp!=null?w.temp.toFixed(1):'?'}°C</b> &nbsp; 💧 <b>${w.rain!=null?w.rain.toFixed(2):'?'} mm/h</b> &nbsp; 💨 <b>${w.windSpeed!=null?w.windSpeed.toFixed(1):'?'} m/s</b>`,
            `☀ <b>${_radWm2} W/m²</b> (sunP ${w.sunPower!=null?w.sunPower.toFixed(2):'?'}) &nbsp; ratio <b>${_csr}</b> &nbsp; radCorr −<b>${_radCorr}</b>`,
            `layered <b>${_layered}</b> → vis <b>${visualCloud.toFixed(0)}</b> &nbsp; cDens <b>${cDensity.toFixed(3)}</b> &nbsp; code <b>${w.weatherCode??'?'}</b>`,
        ].join('<br>');
    }
    _tStorm=isThunderstorm(w)?1:clamp(((w.rainRaw??w.rain??0)+(w.showers??0)*0.75)/7,0,.65);
    if(_firstApply){
        // První load — přeskočit easing, okamžitě nastavit finální hodnoty
        cDensity=_tDensity; cWind=_tWind; cStorm=_tStorm;
        fDensity=_tFDensity; _sRainLvl=_tRainLvl;
        _stableRainLvl=_tRainLvl|0; _firstApply=false;
    }
    cDL=getDL(getRenderHour());
    if(isFog(w)){
        const vf=w.visibility!=null?1-clamp(w.visibility/9000,0,1):0.45;
        const hf=w.humidity!=null?clamp((w.humidity-82)/18,0,1):0.4;
        _tFDensity=lerp(1.15,1.85,clamp(vf*0.75+hf*0.25,0,1));
    } else _tFDensity=0;
    fWind=w.wind||0;
    // rain level target for smooth drop count transitions
    const _snowA=isSnow(w);
    _tRainLvl=_snowA?2:rainLevel(w.rain||0);
    if(mode!=='test') return;
    const hr=Math.floor(w.hour??0), mn=Math.round(((w.hour??0)-hr)*60);
    const dl=getDL(w.hour??12);
    const tod=dl<.05?'noc':dl<.35?'soumrak':'';
    const lvl=isSnow(w)?0:rainLevel(w.rain||0);
    const rainDesc=['','mrholení','déšť','silný déšť','průtrž'][lvl];
    document.getElementById('hud-name').textContent=w.name;
    document.getElementById('hud-sub').textContent=
        `${w.temp}°C  ·  ${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`+
        (tod?'  ·  '+tod:'')+(rainDesc?'  ·  '+rainDesc:'');
}

async function fetchAndRender(){
    try{
        // Paralelní fetch: ECMWF pro předpověď + standard endpoint pro current (aktuální stanice, ~15min)
        const ecmwfUrl=`https://api.open-meteo.com/v1/ecmwf?latitude=${LAT}&longitude=${LON}`+
            `&timezone=Europe%2FPrague&forecast_days=2`+
            `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,rain,showers,snowfall,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,direct_radiation,shortwave_radiation`+
            `&daily=sunrise,sunset`;
        const currentUrl=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
            `&timezone=Europe%2FPrague`+
            `&current=temperature_2m,relative_humidity_2m,precipitation,rain,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,direct_radiation,shortwave_radiation`+
            `&forecast_days=1`;

        const [ecmwfResp, currentResp] = await Promise.all([fetch(ecmwfUrl), fetch(currentUrl)]);
        const [payload, currentPayload] = await Promise.all([ecmwfResp.json(), currentResp.json()]);
        const cur = currentPayload?.current ?? null;

        // ECMWF vrací pouze hourly — najdeme index odpovídající aktuální hodině
        const nowHourIdx = (function(){
            const times = payload?.hourly?.time ?? [];
            const nowH = currentLocalHour();
            let best = 0, bestDiff = Infinity;
            for (let i = 0; i < times.length; i++){
                const h = parseHourValue(times[i]);
                if (h == null) continue;
                const diff = Math.abs(h - nowH);
                if (diff < bestDiff){ bestDiff = diff; best = i; }
            }
            return best;
        })();
        const data = getHourlySourceAt(payload.hourly, nowHourIdx);

        // Přepsat klíčová data aktuálními hodnotami ze stanic (current= endpoint, ~15min čerstvost)
        if (cur) {
            if (cur.cloud_cover != null) {
                data.cloud_cover = cur.cloud_cover;
                // Vrstvová data zachováme z ECMWF — jsou jediný zdroj info o typu oblačnosti.
                // layerBoost je zastropován na max 40, takže nemůže výrazně přebít aktuální cloud_cover.
            }
            if (cur.weather_code      != null) data.weather_code      = cur.weather_code;
            if (cur.rain              != null) data.rain              = cur.rain;
            if (cur.precipitation     != null) data.precipitation     = cur.precipitation;
            if (cur.temperature_2m    != null) data.temperature_2m    = cur.temperature_2m;
            if (cur.wind_speed_10m    != null) data.wind_speed_10m    = cur.wind_speed_10m;
            if (cur.wind_gusts_10m    != null) data.wind_gusts_10m    = cur.wind_gusts_10m;
            if (cur.direct_radiation  != null) data.direct_radiation  = cur.direct_radiation;
            if (cur.shortwave_radiation != null) data.shortwave_radiation = cur.shortwave_radiation;
            if (cur.is_day            != null) data.is_day            = cur.is_day;
            console.log('current= přepsalo ECMWF:', JSON.stringify({
                cloud: cur.cloud_cover, code: cur.weather_code, rain: cur.rain,
                temp: cur.temperature_2m, rad: cur.direct_radiation
            }));
        }

        const sunPower=clamp((data.direct_radiation??0)/700,0,1);
        // DEBUG — plný výpis do konzole pro diagnostiku
        console.log('ECMWF API odpověď:', JSON.stringify({
            idx: nowHourIdx,
            time: payload.hourly?.time?.[nowHourIdx],
            temp: data.temperature_2m,
            cloud: data.cloud_cover,
            cloudLow: data.cloud_cover_low,
            cloudMid: data.cloud_cover_mid,
            cloudHigh: data.cloud_cover_high,
            rad: data.direct_radiation,
            sunP: sunPower.toFixed(2),
            wcode: data.weather_code,
            rain: data.rain,
            isDay: data.is_day
        }));
        if (data.cloud_cover == null) {
            console.warn('ECMWF: cloud_cover je null — zkontroluj dostupné proměnné endpointu');
        }
        const anchorHour = currentLocalHour();
        const targetSource = getNextHourlySource(payload, anchorHour);
        liveForecast = {
            payload,
            anchorHour,
            targetHour: parseHourValue(targetSource?.time) ?? anchorHour,
            currentSource: data,
            targetSource
        };
        syncLiveWeatherFromForecast();
    }catch(e){
        console.error('Open-Meteo fetch failed:',e);
        // Fallback — vždy zobraz něco rozumného, i když byl '…' placeholder
        if(!liveForecast){
            const h=currentLocalHour();
            applyWeather({name:'—',temp:15,rain:0,cloud:20,wind:0,hour:h,
                sunriseHour:SUNRISE,sunsetHour:SUNSET,isDay:h>6&&h<20,sunPower:0.5});
        }
        // Retry za 2 minuty místo čekání na dalších 15 minut
        setTimeout(()=>{ if(mode==='live') fetchAndRender(); }, 120000);
    }
}

function sliderUpdate(){
    const hour=parseFloat(document.getElementById('sl-hour').value);
    const temp=parseInt(document.getElementById('sl-temp').value);
    const cloud=parseInt(document.getElementById('sl-cloud').value);
    const rain=parseFloat(document.getElementById('sl-rain').value);
    const wind=parseFloat(document.getElementById('sl-wind').value);
    const rawLow=parseInt(document.getElementById('sl-cloud-low').value);
    const rawMid=parseInt(document.getElementById('sl-cloud-mid').value);
    const rawHigh=parseInt(document.getElementById('sl-cloud-high').value);
    const cloudLow  = rawLow  >= 0 ? rawLow  : null;
    const cloudMid  = rawMid  >= 0 ? rawMid  : null;
    const cloudHigh = rawHigh >= 0 ? rawHigh : null;
    const hr=Math.floor(hour),mn=Math.round((hour-hr)*60);
    document.getElementById('sv-hour').textContent=`${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
    document.getElementById('sv-temp').textContent=`${temp}°C`;
    document.getElementById('sv-cloud').textContent=`${cloud}%`;
    document.getElementById('sv-cloud-low').textContent=rawLow>=0?`${rawLow}%`:'auto';
    document.getElementById('sv-cloud-mid').textContent=rawMid>=0?`${rawMid}%`:'auto';
    document.getElementById('sv-cloud-high').textContent=rawHigh>=0?`${rawHigh}%`:'auto';
    const lvl=rainLevel(rain);
    const desc=['žádné','mrholení','déšť','silný déšť','průtrž'][lvl];
    document.getElementById('sv-rain').textContent=rain>0?`${rain.toFixed(1)} · ${desc}`:'0.0';
    document.getElementById('sv-wind').textContent=wind.toFixed(2);
    document.querySelectorAll('.p-btn').forEach(b=>b.classList.remove('on'));
    rainDropOSC={};
    applyWeather({name:guessName(temp,rain,cloud),temp,rain,cloud,cloudLow,cloudMid,cloudHigh,wind,hour,cloudStyle:selectedCloudStyle || 'default'});
}

        document.getElementById('sl-temp').value=p.temp;
        document.getElementById('sl-cloud').value=p.cloud;
        document.getElementById('sl-cloud-low').value=p.cloudLow!=null?p.cloudLow:-1;
        document.getElementById('sl-cloud-mid').value=p.cloudMid!=null?p.cloudMid:-1;
        document.getElementById('sl-cloud-high').value=p.cloudHigh!=null?p.cloudHigh:-1;
        document.getElementById('sv-cloud-low').textContent=p.cloudLow!=null?p.cloudLow+'%':'auto';
        document.getElementById('sv-cloud-mid').textContent=p.cloudMid!=null?p.cloudMid+'%':'auto';

        document.getElementById('sl-rain').value=p.rain;

        document.getElementById('sv-temp').textContent=`${p.temp}°C`;
        document.getElementById('sv-cloud').textContent=`${p.cloud}%`;
        document.getElementById('sv-rain').textContent=p.rain>0?p.rain.toFixed(1):'0.0';

        b.classList.add('on');
        rainDropOSC={};
        // Použij přesně jméno presetu — ne guessName (ta by přepsala MLHA na OBLAČNO)
        applyWeather({name:p.name, temp:p.temp, rain:p.rain, cloud:p.cloud, cloudLow:p.cloudLow??null, cloudMid:p.cloudMid??null, cloudHigh:p.cloudHigh??null, wind:p.wind, hour:p.hour, cloudStyle:p.cloudStyle||'default'});

    presetsEl.appendChild(b);
});

// Populate blend-preview selects with preset names
(function(){
    const fromEl = document.getElementById('bp-from');
    const toEl   = document.getElementById('bp-to');
    PRESETS.forEach((p, i) => {
        const o1 = document.createElement('option'); o1.value = p.name; o1.textContent = p.name;
        const o2 = document.createElement('option'); o2.value = p.name; o2.textContent = p.name;
        fromEl.appendChild(o1);
        toEl.appendChild(o2);
    });
    // Default: from first preset, to second
    if (fromEl.options.length > 1) toEl.selectedIndex = 1;
})();

let _bpRaf = null;
function blendPreviewPlay() {
    if (_bpRaf) { cancelAnimationFrame(_bpRaf); _bpRaf = null; }
    const fromName = document.getElementById('bp-from').value;
    const toName   = document.getElementById('bp-to').value;
    const from = PRESETS.find(p => p.name === fromName);
    const to   = PRESETS.find(p => p.name === toName);
    if (!from || !to) return;
    const duration = parseFloat(document.getElementById('bp-speed').value) * 1000;
    const bar      = document.getElementById('bp-bar');
    const tVal     = document.getElementById('bp-t-val');
    const playBtn  = document.getElementById('bp-play');
    playBtn.textContent = '◼ STOP';
    const start = performance.now();
    function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const hour  = lerp(from.hour,  to.hour,  t);
        const temp  = lerp(from.temp,  to.temp,  t);
        const cloud = lerp(from.cloud, to.cloud, t);
        const rain  = lerp(from.rain,  to.rain,  t);
        const wind  = lerp(from.wind,  to.wind,  t);
        bar.style.width = (t * 100) + '%';
        tVal.textContent = 't=' + t.toFixed(2);
        const style = t < 0.5 ? (from.cloudStyle || 'default') : (to.cloudStyle || 'default');
        applyWeather({ name: t < 0.5 ? from.name : to.name,
            temp, rain, cloud, wind, hour, cloudStyle: style });
        if (t < 1) {
            _bpRaf = requestAnimationFrame(tick);
        } else {
            _bpRaf = null;
            playBtn.textContent = '▶ PŘEHRÁT';
        }
    }
    _bpRaf = requestAnimationFrame(tick);
}

initClouds();
